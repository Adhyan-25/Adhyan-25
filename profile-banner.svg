 <pattern id="dots" width="12" height="12" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r=".7" fill="#d5bd72" opacity=".25"/></pattern>
 <pattern id="pix" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0 0H8V8" fill="none" stroke="#c7a84d" stroke-opacity=".1"/></pattern>
 <filter id="glow"><feGaussianBlur stdDeviation="10"/></filter>
</defs>
