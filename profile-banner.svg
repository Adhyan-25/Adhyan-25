<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="300" viewBox="0 0 1600 300" role="img" aria-labelledby="title desc">
<title id="title">ADHYAN — dark fantasy pixel-art banner</title>
<desc id="desc">An ultra-wide, dark pixel-art fantasy banner inspired by Elden Ring: a lone knight at left, ruined castles and a stone bridge, a glowing golden tree at right, a circular rune and crossed swords above ADHYAN, with gold text on charcoal.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#05090b"/><stop offset=".5" stop-color="#101613"/><stop offset="1" stop-color="#241b0d"/></linearGradient>
 <linearGradient id="gold"><stop stop-color="#f3d878"/><stop offset="1" stop-color="#9c7024"/></linearGradient>
 <pattern id="dots" width="12" height="12" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r=".7" fill="#d5bd72" opacity=".2"/></pattern>
 <pattern id="pixels" width="8" height="8" patternUnits="userSpaceOnUse"><path d="M0 0H8V8" fill="none" stroke="#d3b45a" stroke-opacity=".15" stroke-width=".6"/></pattern>
 <filter id="glow"><feGaussianBlur stdDeviation="12"/></filter>
</defs>
