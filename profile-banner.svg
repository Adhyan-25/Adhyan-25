<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
<title id="title">ADHYAN — Dark fantasy pixel art</title>
<desc id="desc">Pixel-art fantasy ruins, a lone knight, a broken bridge, a glowing golden tree, a circular rune and swords above the ADHYAN title, in a dark GitHub profile banner.</desc>
<defs>
